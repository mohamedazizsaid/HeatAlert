services:

  app:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: heatalert-app
    restart: unless-stopped
    working_dir: /var/www
    env_file:
      - .env
    volumes:
      - .:/var/www
    depends_on:
      - mysql
    networks:
      - heatalert-network

  nginx:
    image: nginx:alpine
    container_name: heatalert-nginx
    restart: unless-stopped
    ports:
      - "8080:80"
    volumes:
      - .:/var/www
      - ./nginx/default.conf:/etc/nginx/conf.d/default.conf
    depends_on:
      - app
    networks:
      - heatalert-network

  mysql:
    image: mysql:8.0
    container_name: heatalert-mysql
    restart: unless-stopped
    environment:
      MYSQL_DATABASE: heatalert
      MYSQL_USER: heatalert
      MYSQL_PASSWORD: heatalert_password
      MYSQL_ROOT_PASSWORD: root_password
    ports:
      - "3307:3306"
    volumes:
      - mysql-data:/var/lib/mysql
    networks:
      - heatalert-network

networks:
  heatalert-network:
    driver: bridge

volumes:
  mysql-data: